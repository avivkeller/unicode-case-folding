name: Spec Changes

on:
  workflow_dispatch:
  schedule:
    # Once a week
    - cron: "0 0 * * 1"

permissions: {}

jobs:
  check:
    name: Check specifications
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # Opens an issue for each specification with a revision newer than
      # the one recorded in the "specs" of the packages that implement it
      - name: Open issues for changed specifications
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: npm run specs -- --open-issues
