name: Release Changed Packages

on:
  workflow_dispatch:
  schedule:
    # Once a month, to pick up new UCD and CLDR releases
    - cron: "0 0 1 * *"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # Builds from the latest UCD and CLDR releases
      - name: Build packages
        run: npm run build

      - name: Run tests
        run: npm test

      # Compares each package with its latest release on npm, and publishes
      # the ones that changed with a patch version bump
      - name: Publish changed packages
        id: release
        run: npm run release

      - name: Commit version bumps
        if: steps.release.outputs.released != ''
        env:
          RELEASED: ${{ steps.release.outputs.released }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git diff --quiet || git commit -am "Release $RELEASED"
          git push
