name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Once a week
    - cron: "0 0 * * 1"

permissions: {}

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # Builds from the latest UCD and CLDR releases
      - name: Build packages
        run: npm run build

      - name: Run tests
        run: npm test

      # Changes made by people: with changesets on main, opens or updates the
      # "Version Packages" pull request (minor bumps and changelogs)
      - name: Open the changeset release pull request
        if: github.event_name == 'push'
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

      # Once that pull request is merged, publishes the versions it bumped
      - name: Publish changeset releases
        if: github.event_name == 'push' && steps.changesets.outputs.has-changesets == 'false'
        run: npm run release -- --bumped

      # New data: compares each package with its latest release on npm, and
      # publishes the ones that changed with a patch version bump, without a
      # pull request. Packages with a changeset wait for their minor release
      - name: Publish packages changed by new data
        if: github.event_name != 'push'
        id: release
        run: npm run release

      - name: Commit version bumps
        if: steps.release.outputs.released != ''
        env:
          RELEASED: ${{ steps.release.outputs.released }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add packages
          git diff --cached --quiet || git commit -m "Release $RELEASED"
          git push
